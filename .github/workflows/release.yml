name: Release

# 发布 GitHub Release 时自动构建 macOS dmg + Windows exe，并挂到该 Release 的 Assets。
# 手动触发（workflow_dispatch）只构建并上传为 Actions artifact，不会碰任何 Release。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  macos-dmg:
    name: macOS dmg
    # macos-latest 是 arm64 runner，产物名形如 CCConfig_<version>_aarch64.dmg
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          if [ "v$version" != "${{ github.event.release.tag_name }}" ]; then
            echo "::error::Release tag ${{ github.event.release.tag_name }} does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # public/preload 有独立依赖（json5 / smol-toml / fzstd），根 npm ci 的
      # postinstall 会装；这里显式再跑一次，避免 CI 环境跳过 lifecycle scripts
      - name: Install preload dependencies
        run: node scripts/install-preload-deps.mjs

      - name: Build frontend + sidecar
        run: npm run build:app

      # 自动更新包必须用私钥签名；未配置 Secret 时退回普通安装包，避免发布流程整体失败
      - name: Detect updater signing key
        id: updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; building without updater artifacts."
          fi

      - name: Build dmg
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_ENABLED: ${{ steps.updater.outputs.enabled }}
        run: |
          if [ "$UPDATER_ENABLED" = "true" ]; then
            # app 目标才会生成 macOS 的 .app.tar.gz 更新包；只打 dmg 会被 bundler 跳过
            npx tauri build --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npx tauri build --bundles dmg
          fi

      - name: Upload dmg to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" src-tauri/target/release/bundle/dmg/*.dmg --clobber

      - name: Upload updater bundle to release
        if: github.event_name == 'release' && steps.updater.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            src-tauri/target/release/bundle/macos/*.app.tar.gz \
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig \
            --clobber

      - name: Upload dmg artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ccconfig-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows-exe:
    name: Windows exe
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          if [ "v$version" != "${{ github.event.release.tag_name }}" ]; then
            echo "::error::Release tag ${{ github.event.release.tag_name }} does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # public/preload 有独立依赖（json5 / smol-toml / fzstd），根 npm ci 的
      # postinstall 会装；这里显式再跑一次，避免 CI 环境跳过 lifecycle scripts
      - name: Install preload dependencies
        run: node scripts/install-preload-deps.mjs

      - name: Build frontend + sidecar
        run: npm run build:app

      # 自动更新包必须用私钥签名；未配置 Secret 时退回普通安装包，避免发布流程整体失败
      - name: Detect updater signing key
        id: updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; building without updater artifacts."
          fi

      - name: Build NSIS installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_ENABLED: ${{ steps.updater.outputs.enabled }}
        run: |
          if [ "$UPDATER_ENABLED" = "true" ]; then
            npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npx tauri build --bundles nsis
          fi

      - name: Upload exe to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" src-tauri/target/release/bundle/nsis/*.exe --clobber

      - name: Upload updater signature to release
        if: github.event_name == 'release' && steps.updater.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" src-tauri/target/release/bundle/nsis/*.exe.sig --clobber

      - name: Upload exe artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ccconfig-windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # 两个平台都上传完成后，把各自的 .sig 合并成 updater 的 latest.json。
  # 缺少签名（未配置 Secret）时脚本直接跳过，不会破坏普通发布。
  updater-manifest:
    name: Updater manifest
    needs: [macos-dmg, windows-exe]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p updater
          gh release download "$TAG" --dir updater

      - name: Generate latest.json
        env:
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: node scripts/generate-updater-manifest.mjs --dir updater

      - name: Upload latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -f updater/latest.json ]; then
            gh release upload "$TAG" updater/latest.json --clobber
          else
            echo "No signed updater artifacts; latest.json not generated."
          fi
