[package]
name = "ccconfig"
version = "1.0.0"
edition = "2021"
description = "Multi-app AI configuration manager for Claude Code, OpenCode, Pi, Codex and more"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
